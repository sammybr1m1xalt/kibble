name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Smoke — verifier parses
        run: python kibble_verifier.py --help > /dev/null
      - name: Smoke — every script parses
        run: |
          for s in snapshot-query metric-diff attesttrace validator-watch canned-audit export-cacher did-verify technocore-publish check-tclk-offers test-message-signing; do
            python scripts/$s.py --help > /dev/null
          done
